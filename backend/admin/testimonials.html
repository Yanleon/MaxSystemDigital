<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Testimonios | MaxSystemDigital</title>
    <link rel="stylesheet" href="assets/css/admin.css">
    <link rel="stylesheet" href="assets/css/dashboard.css">
</head>
<body class="page admin-v2">

    <div class="sidebar-backdrop" id="sidebarBackdrop" onclick="document.body.classList.remove('sidebar-open')"></div>
    <div class="dashboard-layout">
        <aside class="sidebar">
            <div class="user-card">
                <div class="avatar"><span>CY</span></div>
                <h3>MaxSystemDigital</h3>
                <p class="muted">Admin Panel</p>
            </div>
            <nav class="side-nav">
                <a href="dashboard.html">Dashboard</a>
                <a href="contacts.html">Contactos</a>
                <a href="clients.html">Clientes</a>
                <a href="services.html">Servicios</a>
                <a href="plans.html">Planes</a>
                <a href="testimonials.html" class="active">Testimonios</a>
                <a href="portfolio.html">Trabajos</a>
                <a href="about.html">Sobre Nosotros</a>
                <a href="seo.html">SEO</a>
                <a href="footer.html">Footer</a>
                <a href="users.html">Usuarios</a>
                <a href="support.html" class="support-only">Soporte</a>
                <a href="profile.html" class="profile-only">Perfil</a>
                <a href="#" class="logout-link" id="logoutLink">Cerrar sesión</a>
            </nav>
        </aside>

        <main class="dashboard-main">
            <header class="dash-header">
                <button type="button" class="mobile-menu-btn" id="mobileMenuBtn" aria-label="Abrir menu" onclick="document.body.classList.toggle('sidebar-open')">☰</button>
                <div>
                    <p class="muted">Gestión de testimonios</p>
                    <h1>Testimonios</h1>
                </div>
            </header>

            <div class="card">
                <h2>Crear testimonio</h2>
                <form id="testimonialForm">
                    <input type="text" id="tAuthor" placeholder="Nombre del autor" required>
                    <input type="text" id="tRole" placeholder="Cargo o empresa (opcional)">
                    <textarea id="tContent" rows="4" placeholder="Contenido del testimonio" required></textarea>
                    <label style="display:flex;gap:8px;align-items:center;margin-bottom:12px;">
                        <input type="checkbox" id="tActive" checked style="width:auto;margin:0;"> Activo
                    </label>
                    <button type="submit" class="btn">Guardar testimonio</button>
                    <span id="testimonialFormMsg" class="muted"></span>
                </form>
            </div>

            <div class="card" style="margin-top:14px;">
                <h2>Listado</h2>
                <div style="max-width:260px; margin-bottom:10px;">
                    <select id="testimonialsFilter">
                        <option value="all">Todos</option>
                        <option value="active">Solo activos</option>
                        <option value="inactive">Solo inactivos</option>
                    </select>
                </div>
                <table>
                    <thead>
                        <tr>
                            <th>Autor</th>
                            <th>Rol</th>
                            <th>Contenido</th>
                            <th>Estado</th>
                            <th>Acciones</th>
                        </tr>
                    </thead>
                    <tbody id="testimonialsTable">
                        <tr><td colspan="5">Cargando...</td></tr>
                    </tbody>
                </table>
                <p id="testimonialStatus" class="muted"></p>
            </div>
        </main>
    </div>

    <div id="testimonialModal" class="modal-backdrop" style="display:none;">
        <div class="modal">
            <h3>Editar testimonio</h3>
            <label for="editTAuthor">Autor</label>
            <input type="text" id="editTAuthor">
            <label for="editTRole">Rol</label>
            <input type="text" id="editTRole">
            <label for="editTContent">Contenido</label>
            <textarea id="editTContent" rows="4"></textarea>
            <label style="display:flex;gap:8px;align-items:center;margin-bottom:12px;">
                <input type="checkbox" id="editTActive" style="width:auto;margin:0;"> Activo
            </label>
            <div class="modal-actions">
                <button class="btn secondary" id="closeTestimonialModal">Cancelar</button>
                <button class="btn" id="saveTestimonialModal">Guardar</button>
            </div>
            <p id="testimonialModalMsg" class="muted"></p>
        </div>
    </div>

<script src="assets/js/testimonials.js"></script>
<script src="assets/js/logout.js"></script>
</body>
</html>
