<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin | MaxSystemDigital</title>
    <link rel="stylesheet" href="assets/css/admin.css">
</head>
<body class="login-body">

<main class="login-shell">
    <section class="login-container">
        <div class="login-brand">
            <span class="login-badge"><i class="fas fa-bolt"></i></span>
            <div>
                <p class="login-kicker">MaxSystemDigital</p>
                <h1>Panel Administrativo</h1>
            </div>
        </div>

        <p class="muted login-subtitle">Ingresa para gestionar hero, contenidos, planes, testimonios y contactos.</p>

        <form id="loginForm" class="login-form">
            <label for="email">Correo</label>
            <input type="email" id="email" placeholder="admin@maxsystemdigital.com" required>

            <label for="password">Contrasena</label>
            <input type="password" id="password" placeholder="********" required>

            <button type="submit" class="btn login-btn">Ingresar al panel</button>
        </form>

        <p id="error" class="error"></p>
    </section>
</main>

<script src="assets/js/auth.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/js/all.min.js"></script>
</body>
</html>
